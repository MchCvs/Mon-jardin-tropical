<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2d5a2d">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mon Jardin Tropical</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font: 16px sans-serif; background: #f0f8f0; color: #222; }
header { background: #2d5a2d; color: white; padding: 20px; text-align: center; }
main { max-width: 600px; margin: 20px auto; padding: 20px; }
.card { background: white; padding: 20px; margin: 15px 0; border-radius: 10px; box-shadow: 0 2px 8px #0002; }
h2 { color: #2d5a2d; margin-bottom: 15px; }
.moon { text-align: center; font-size: 3rem; margin: 20px 0; }
.phase-name { text-align: center; font-size: 1.2rem; font-weight: bold; color: #2d5a2d; margin: 10px 0; }
.advice { background: #f0f8f0; padding: 15px; border-left: 4px solid #2d5a2d; border-radius: 5px; margin: 10px 0; }
.advice-why { font-style: italic; color: #555; margin-bottom: 10px; }
.advice ul { margin: 8px 0 8px 20px; }
.advice li { margin: 5px 0; }
.advice-avoid { background: #fff3e0; padding: 10px; border-left: 4px solid #e65100; border-radius: 5px; margin-top: 10px; }
.advice-avoid b { color: #e65100; }
.plants { display: grid; gap: 10px; }
.plant { padding: 10px; background: #e8f5e9; border-radius: 5px; border-left: 4px solid #4caf50; }
.plant-name { font-weight: bold; color: #2d5a2d; }
.plant-phase { font-size: 0.85rem; color: #666; }
.plant-task { margin-top: 6px; padding: 8px; background: #fffde7; border-left: 3px solid #fbc02d; border-radius: 4px; font-size: 0.9rem; }
.plant-task b { color: #2d5a2d; }
.tasks { margin-top: 15px; }
label { display: block; padding: 8px 0; }
input[type=checkbox] { margin-right: 8px; }
button { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; background: #2d5a2d; color: white; font-weight: bold; cursor: pointer; }
#weather { text-align: center; }
.weather-icon { font-size: 3rem; margin: 10px 0; }
.weather-temp { font-size: 2rem; font-weight: bold; }
.weather-desc { margin: 10px 0; }
.weather-details { color: #666; font-size: 0.9rem; margin-top: 10px; }
.weather-source { font-size: 0.75rem; color: #888; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>🌴 Mon Jardin Tropical</h1>
  <p>La Réunion</p>
  <p style="font-size: 0.9em; margin-top: 5px; font-style: italic;">Créé pour Anne, ma chérie...</p>
</header>
<main>
<div class="card">
<h2>🌙 Calendrier Lunaire</h2>
<div class="moon" id="moon">🌙</div>
<div class="phase-name" id="phase">Nouvelle Lune</div>
<div class="advice" id="advice"></div>
</div>

<div class="card">
<h2>🌺 Plantes Recommandées</h2>
<div class="plants" id="plants"></div>
</div>

<div class="card">
<h2>🌤️ Météo à Piton Sainte Rose</h2>
<div id="weather">
  <div class="weather-icon" id="weather-icon">⏳</div>
  <div class="weather-temp" id="weather-temp"></div>
  <div class="weather-desc" id="weather-desc"></div>
  <div class="weather-details">
    <span id="weather-humidity"></span> |
    <span id="weather-wind"></span>
  </div>
  <div class="weather-source">Données : OpenWeatherMap</div>
</div>
</div>

<div class="card">
<h2>✅ Tâches du Jour</h2>
<div class="tasks" id="tasks"></div>
<button onclick="addTask()">+ Ajouter une tâche</button>
<button onclick="clearTasks()" style="background: #666;">Effacer</button>
</div>
</main>

  { nom: 'Pois d\'angole (pois congo)', phase: 'Lune Croissante', desc: 'Légume et brède traditionnelle', tache: 'Récolter les jeunes cosses et les feuilles, semer en poquets de 2 graines, butter les plants.' },
  { nom: 'Haricot voème', phase: 'Nouvelle Lune', desc: 'Haricot de Lima, gousse plate', tache: 'Semer en place près d\'un tuteur, récolter les cosses jeunes et tendres avant que le grain ne grossisse.' },
  { nom: 'Cresson', phase: 'Nouvelle Lune', desc: 'Cresson du bord des ravines', tache: 'Semer ou repiquer au bord d\'un ruissellement propre, récolter les tiges en cassant, jamais à ras.' },
  { nom: 'Giraumon (citrouille)', phase: 'Lune Croissante', desc: 'La courge reine du carry péi', tache: 'Récolter les giraumons au tonnerre sonnant creux et la tige ligneuse, semer en poquets de 3 graines en terre riche.' },

  // Épices et aromates
  { nom: 'Citronnelle (vasoury)', phase: 'Lune Décroissante', desc: 'Tiges parfumées pour tisanes et rhums arrangés', tache: 'Récolter les tiges en coupant à la base, diviser la touffe (chaque éclat avec racines repart), désherber le pied.' },
  { nom: 'Cannelier (cannelle)', phase: 'Lune Décroissante', desc: 'Arbre à écorce de cannelle', tache: 'Élaguer les branches, récolter l\'écorce sur les branches coupées, la faire sécher à l\'ombre en rouleaux.' },
  { nom: 'Giroflier', phase: 'Lune Croissante', desc: 'Clous de girofle du jardin', tache: 'Récolter les boutons floraux rose-rouge avant éclosion, les sécher à l\'ombre jusqu\'à couleur brun-rouge.' },
  { nom: 'Liane poivre (poivre vert)', phase: 'Lune Croissante', desc: 'Poivre des tables créoles', tache: 'Récolter les grappes de baies vertes, marcotter la liane, palisser sur un tuteur ombragé.' },
  { nom: 'Muscadier', phase: 'Lune Croissante', desc: 'Muscade et macis', tache: 'Récolter les fruits jaunes qui s\'ouvrent, récupérer la noix et son fil rouge (macis), sécher à l\'ombre.' },

  // Plantes utilitaires du jardin péi
  { nom: 'Canne à sucre', phase: 'Lune Décroissante', desc: 'Canne du grand-père pour le jus et le rhum', tache: 'Couper les cannes mûres au ras du sol (bout du haut planté pour multiplier), butter les rejets, désherber la touffe.' },
  { nom: 'Vétiver', phase: 'Lune Décroissante', desc: 'Haie anti-érosion parfumée', tache: 'Diviser et replanter les touffes en bordure de terrain (retient la terre), bouturer des éclats racinés, tailler la haie.' }
];
];

let tasks = JSON.parse(localStorage.getItem('jardin-tasks') || '[]');
let currentMoonPhase = -1;

// Calcul de la phase lunaire (corrigé)
function getPhase() {
  const now = new Date();
  const ref = new Date(2000, 0, 6);
  const days = (now - ref) / 86400000;
  const phase = (days % 29.530588) / 29.530588;
  return Math.floor(phase * 4);
}

// Fonction pour récupérer la météo de Piton Sainte Rose
async function fetchWeather() {
  const apiKey = "006e77a4bae1e387bb1c24beaec1a039"; // Ta clé API

  try {
    const response = await fetch(
      `https://api.openweathermap.org/data/2.5/weather?lat=-21.1167&lon=55.7667&appid=${apiKey}&units=metric&lang=fr`
    );
    const data = await response.json();

    if (data.cod !== 200) {
      document.getElementById('weather').innerHTML = `
        <p>⚠️ ${data.message || 'Erreur de chargement'}</p>
        <p class="weather-source"><small>Note : La Réunion compte +200 microclimats. Ces données sont une approximation pour Piton Sainte Rose.</small></p>
      `;
      return;
    }

    document.getElementById('weather-icon').textContent = getWeatherIcon(data.weather[0].icon);
    document.getElementById('weather-temp').textContent = Math.round(data.main.temp) + '°C';
    document.getElementById('weather-desc').textContent = data.weather[0].description;
    document.getElementById('weather-humidity').textContent = 'Humidité: ' + data.main.humidity + '%';
    document.getElementById('weather-wind').textContent = 'Vent: ' + Math.round(data.wind.speed * 3.6) + ' km/h';
  } catch (error) {
    document.getElementById('weather').innerHTML = `
      <p>⚠️ Impossible de charger la météo</p>
      <p class="weather-source"><small>Vérifiez votre connexion ou attendez que la clé API soit active (1-2h).</small></p>
    `;
  }
}

// Convertit les codes OpenWeatherMap en emojis
function getWeatherIcon(code) {
  const icons = {
    '01d': '☀️', '01n': '🌙',
    '02d': '⛅', '02n': '🌤',
    '03d': '☁️', '03n': '☁️',
    '04d': '☁️', '04n': '☁️',
    '09d': '🌦', '09n': '🌧',
    '10d': '🌧', '10n': '🌧',
    '11d': '⛈', '11n': '⛈',
    '13d': '❄️', '13n': '❄️',
    '50d': '🌫', '50n': '🌫'
  };
  return icons[code] || '🌦';
}

// Dessine l'interface
function drawUI() {
  const phase = getPhase();
  const lune = lunaires[phase];
  currentMoonPhase = phase;

  document.getElementById('moon').textContent = lune.emoji;
  document.getElementById('phase').textContent = lune.nom;

  let adviceHtml = '<b>À faire aujourd\'hui :</b> ' + lune.conseil;
  adviceHtml += '<p class="advice-why">' + lune.explication + '</p>';
  adviceHtml += '<b>Ce que ça veut dire concrètement :</b><ul>';
  lune.actions.forEach(a => { adviceHtml += '<li>' + a + '</li>'; });
  adviceHtml += '</ul>';
  adviceHtml += '<div class="advice-avoid"><b>À éviter :</b> ' + lune.eviter + '</div>';
  document.getElementById('advice').innerHTML = adviceHtml;

  let html = '';
  plantes_reunion.forEach(p => {
    if (p.phase === lune.nom) {
      let emoji = '🌱';
      if (p.nom === 'Vanille' || p.nom === 'Fleur de Passage' || p.nom === 'Hibiscus' || p.nom === 'Frangipanier' || p.nom === 'Bougainvillée' || p.nom === 'Orchidée' || p.nom === 'Canna' || p.nom === 'Oiseau de paradis' || p.nom === 'Alstroemeria' || p.nom === 'Rose de porcelaine' || p.nom === 'Ixora' || p.nom === 'Allamanda' || p.nom === 'Lantana' || p.nom === 'Jasmin' || p.nom === 'Gardenia' || p.nom === 'Anthurium' || p.nom === 'Géranium' || p.nom === 'Quatre épices') emoji = '🌸';
      if (p.nom === 'Letchis' || p.nom === 'Mangue' || p.nom === 'Ananas' || p.nom === 'Corossol' || p.nom === 'Papaye' || p.nom === 'Avocat' || p.nom === 'Bananier' || p.nom === 'Goyavier' || p.nom === 'Tamarin' || p.nom === 'Framboisian' || p.nom === 'Pomme cythère' || p.nom === 'Citron' || p.nom === 'Orange' || p.nom === 'Pomme rose' || p.nom === 'Coing du Japon' || p.nom === 'Noix de coco' || p.nom === 'Mandarinier') || p.nom === 'Chadèque (pamplemousse)' || p.nom === 'Combava' || p.nom === 'Grenadille (passe-passe)' || p.nom === 'Pitahaya (fruit du dragon)' || p.nom === 'Longane (longani)' || p.nom === 'Jacquier (ti jacque)' || p.nom === 'Fruit à pain' || p.nom === 'Caféier' || p.nom === 'Bibassier (bibasse)' || p.nom === 'Jamblon (jambose)' emoji = '🍎';
      if (p.nom === 'Tomate Cerise' || p.nom === 'Piment' || p.nom === 'Salade' || p.nom === 'Radis' || p.nom === 'Herbes aromatiques' || p.nom === 'Carotte' || p.nom === 'Courgette' || p.nom === 'Aubergine' || p.nom === 'Poivron' || p.nom === 'Haricot vert' || p.nom === 'Patate douce' || p.nom === 'Igname' || p.nom === 'Dasheen (Taro)' || p.nom === 'Chou' || p.nom === 'Épinard' || p.nom === 'Concombre' || p.nom === 'Pois carré' || p.nom === 'Chouchou' || p.nom === 'Maïs' || p.nom === 'Pomme de terre' || p.nom === 'Oignon' || p.nom === 'Ail' || p.nom === 'Brèdes morelle' || p.nom === 'Brèdes oseille' || p.nom === 'Moringa (brède mourongue)' || p.nom === 'Zist (petite aubergine amère)' || p.nom === 'Pois d\'angole (pois congo)' || p.nom === 'Haricot voème' || p.nom === 'Cresson' || p.nom === 'Giraumon (citrouille)' || p.nom === 'Citronnelle (vasoury)' || p.nom === 'Cannelier (cannelle)' || p.nom === 'Giroflier' || p.nom === 'Liane poivre (poivre vert)' || p.nom === 'Muscadier' || p.nom === 'Canne à sucre' || p.nom === 'Vétiver' ) emoji = '🥕';
      html += '<div class="plant"><div class="plant-name">' + emoji + ' ' + p.nom + '</div><div class="plant-phase">' + p.desc + '</div><div class="plant-task"><b>🎯 Tâche du jour :</b> ' + p.tache + '</div></div>';
    }
  });
  if (!html) html = '<p>Consultez les autres phases</p>';
  document.getElementById('plants').innerHTML = html;

  let taskHtml = '';
  tasks.forEach((t, i) => {
    taskHtml += '<label><input type="checkbox" ' + (t.done ? 'checked' : '') + ' onchange="toggleTask(' + i + ')">' + t.text + '</label>';
  });
  document.getElementById('tasks').innerHTML = taskHtml || '<p>Aucune tâche</p>';
}

// Gestion des tâches
function addTask() {
  const t = prompt('Nouvelle tâche :');
  if (t) {
    tasks.push({ text: t, done: false });
    localStorage.setItem('jardin-tasks', JSON.stringify(tasks));
    drawUI();
  }
}

function toggleTask(i) {
  tasks[i].done = !tasks[i].done;
  localStorage.setItem('jardin-tasks', JSON.stringify(tasks));
  drawUI();
}

function clearTasks() {
  tasks = [];
  localStorage.setItem('jardin-tasks', JSON.stringify(tasks));
  drawUI();
}

// Initialisation
drawUI();
fetchWeather();
setInterval(fetchWeather, 10 * 60 * 1000); // Rafraîchit la météo toutes les 10 min

// Mise à jour automatique de la phase lunaire toutes les heures
setInterval(() => {
  const newPhase = getPhase();
  if (newPhase !== currentMoonPhase) {
    currentMoonPhase = newPhase;
    drawUI();
  }
}, 60 * 60 * 1000);

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
